<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A2A66" />
    <title>Oakland Parking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <div id="map" role="application" aria-label="Map of open parking spots"></div>

      <header class="topbar">
        <button id="search-btn" class="search-pill" type="button">
          <span data-icon="search" data-size="22"></span>
          Where are you headed?
        </button>
        <div class="controls">
          <button id="menu-btn" class="ctl ctl--menu" type="button" aria-label="Open menu">
            <span data-icon="menu"></span>
          </button>
          <button id="locate-btn" class="ctl" type="button" aria-label="Center map on my location">
            <span data-icon="locate"></span>
          </button>
          <button id="refresh-btn" class="ctl" type="button" aria-label="Refresh open spots">
            <span data-icon="refresh"></span>
          </button>
        </div>
      </header>

      <div id="status-chip" class="chip" role="status" hidden></div>
      <section id="sheet" class="sheet" aria-label="Open spots"></section>
      <aside id="drawer" class="drawer"></aside>
      <div id="search" class="search"></div>
      <div id="banner" class="banner" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
